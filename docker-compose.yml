name: yemenscan_prod

services:
  db:
    image: postgres:15
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      POSTGRES_USER: yemenscan_user
      POSTGRES_PASSWORD: yemenscan_secure_password123
      POSTGRES_DB: yemenscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yemenscan_user -d yemenscan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: yemenscan1-web:latest
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://yemenscan_user:yemenscan_secure_password123@db:5432/yemenscan_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GEMINI_API_KEY=AQ.Ab8RN6LIIf8hFT0LClX813K73P-xubA1a2Riy4D90jSK2zDPrA
      - PREFER_LOCAL_TOOLS=false
      - YEMENSCAN_USE_DOCKER=true
      - WAPITI_ALLOW_LOCAL_BUILD=${WAPITI_ALLOW_LOCAL_BUILD:-true}
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-${PWD}}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scans:/app/scans
      - ./nuclei_templates:/app/nuclei_templates
      - ./nuclei_runtime_templates:/app/nuclei_runtime_templates
      - ./nuclei_templates_official:/app/nuclei_templates_official
      - ./nuclei_update_status.json:/app/nuclei_update_status.json
      - ./scan_capability_matrix.json:/app/scan_capability_matrix.json
      - ./templates:/app/templates
      - ./main.py:/app/main.py
      - ./database.py:/app/database.py
      - ./models.py:/app/models.py
      - ./init_db.py:/app/init_db.py
      - ./core:/app/core
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: yemenscan1-web:latest
    pull_policy: build
    restart: unless-stopped
    command: celery -A core.tasks worker -E --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+psycopg2://yemenscan_user:yemenscan_secure_password123@db:5432/yemenscan_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GEMINI_API_KEY=AQ.Ab8RN6LIIf8hFT0LClX813K73P-xubA1a2Riy4D90jSK2zDPrA
      - PREFER_LOCAL_TOOLS=false
      - YEMENSCAN_USE_DOCKER=true
      - WAPITI_ALLOW_LOCAL_BUILD=${WAPITI_ALLOW_LOCAL_BUILD:-true}
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-${PWD}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scans:/app/scans
      - ./nuclei_templates:/app/nuclei_templates
      - ./nuclei_runtime_templates:/app/nuclei_runtime_templates
      - ./nuclei_templates_official:/app/nuclei_templates_official
      - ./nuclei_update_status.json:/app/nuclei_update_status.json
      - ./scan_capability_matrix.json:/app/scan_capability_matrix.json
      - ./templates:/app/templates
      - ./main.py:/app/main.py
      - ./database.py:/app/database.py
      - ./models.py:/app/models.py
      - ./init_db.py:/app/init_db.py
      - ./core:/app/core
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: yemenscan1-web:latest
    pull_policy: build
    restart: unless-stopped
    command: celery -A core.tasks flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql+psycopg2://yemenscan_user:yemenscan_secure_password123@db:5432/yemenscan_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_UNAUTHENTICATED_API=true
    volumes:
      - ./core:/app/core
      - ./scans:/app/scans
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data_v2:
    driver: local
  redis_data:
    driver: local
